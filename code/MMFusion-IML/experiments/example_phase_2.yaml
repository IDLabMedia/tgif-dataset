CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
WORKERS: 4
ACCUMULATE_ITERS: 6
BATCH_SIZE: 4
WARMUP_EPOCHS: 2
LEARNING_RATE: 0.005
SGD_MOMENTUM: 0.9
WD: 0.0005

DATASET:
  NUM_CLASSES: 2
  TRAIN:
    - '/path/to/train/dataset1.txt'
    - '/path/to/train/dataset2.txt'
  VAL:
    - '/path/to/val/dataset1.txt'
    - '/path/to/val/dataset2.txt'

  IMG_SIZE: 512
  CLASS_WEIGHTS: [0.5, 2.5]
  DELIMITER: ' '  # Can be ' ', ',', '\t', etc.

MODEL:
  NAME: example_name
  MODALS: ['img', 'noiseprint', 'bayar', 'srm']
  PRETRAINED: 'pretrained/segformer/mit_b2.pth'
  NUM_CLASSES: 2
  BACKBONE: MixCMNeXtMHSA-B2
  DETECTION: 'confpool'
  TRAIN_PHASE: 'detection'
  NP_WEIGHTS: 'pretrained/noiseprint/np++.pth'
